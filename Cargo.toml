[workspace]
members = ["crates/fluid-protocol", "crates/fluid-host"]
resolver = "2"

[workspace.package]
version = "0.3.0-alpha.1"
edition = "2024"
rust-version = "1.97"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ts-rs = { version = "12", features = ["serde-compat", "serde-json-impl"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
