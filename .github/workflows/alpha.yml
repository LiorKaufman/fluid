name: Alpha validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            runner: macos-15
          - name: macOS Intel
            runner: macos-15-intel
          - name: Windows x64
            runner: windows-2022
          - name: Linux x64
            runner: ubuntu-22.04
    defaults:
      run:
        shell: bash
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install tested Rust toolchain
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component clippy --component rustfmt
          rustup default 1.97.1
      - run: npm ci
      - name: Formatting and native checks
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --locked
          npm run format:check
      - run: npm run build
      - name: Generated bindings are current
        run: git diff --exit-code -- src/protocol
      - run: npm test
      - name: Package unsigned alpha and compute checksums
        run: npm run package:alpha
      - name: Exercise the packaged desktop app
        if: runner.os != 'Linux'
        run: npm run test:packaged -- --archive
      - name: Exercise the packaged desktop app on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:packaged -- --archive
      - name: Upload verified alpha archives
        uses: actions/upload-artifact@v7
        with:
          name: fluid-alpha-${{ matrix.runner }}
          if-no-files-found: error
          path: |
            release/Fluid-*.zip
            release/Fluid-*.tar.gz
            release/SHA256SUMS.txt
      - name: Upload desktop failure traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: desktop-failure-${{ matrix.runner }}
          if-no-files-found: ignore
          path: test-results/
