name: Archived Mac desktop check

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Alpha validation run containing a verified Mac ARM64 archive
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  desktop:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v8
        with:
          name: fluid-alpha-macos-15
          run-id: ${{ inputs.run_id }}
          path: release
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - run: npm run test:packaged -- --archive
        env:
          FLUID_TRACE_AGENT: '1'
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: archived-mac-failure
          path: test-results/
          if-no-files-found: ignore
