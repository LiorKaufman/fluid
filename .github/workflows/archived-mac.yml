name: Archived Mac desktop check

# Replays desktop tests against an existing archive; Alpha validation builds and
# verifies all release binaries from source.

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Alpha validation run containing a verified Mac ARM64 archive
        required: true
        type: string

      repeat_each:
        description: Number of times to exercise all five desktop tests
        required: false
        default: 1
        type: number

permissions:
  contents: read
  actions: read

jobs:
  desktop:
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        readiness: [probe]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v8
        with:
          name: fluid-alpha-macos-15
          run-id: ${{ inputs.run_id }}
          path: release
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - run: npm run test:packaged -- --archive --grep "bundled MCP adapter" --repeat-each="$FLUID_TEST_REPEAT"
        env:
          FLUID_TEST_REPEAT: ${{ inputs.repeat_each }}
          FLUID_INPUT_READINESS: ${{ matrix.readiness }}
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: archived-mac-failure-${{ matrix.readiness }}
          path: test-results/
          if-no-files-found: ignore
